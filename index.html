<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe4">
<meta name="robots" content="noindex, nofollow">
<title>مختبر OpenAI API — تقرير محمي</title>
<meta name="description" content="تقرير اختبار واجهة OpenAI API، محمي بكلمة مرور.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────────────────────────── */
:root {
  --paper: #f4efe4;
  --paper-2: #fbf8f1;
  --ink: #15110d;
  --muted: #6f6558;
  --line: #ddd4c4;
  --line-strong: #c3b7a3;
  --accent: #b4591f;
  --accent-deep: #7c3a12;
  --mono: "IBM Plex Mono", "IBM Plex Sans Arabic", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --serif: "Noto Naskh Arabic", "Iowan Old Style", Georgia, serif;
  --shadow: 6px 6px 0 rgba(21, 17, 13, .06);
  color-scheme: light;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  background-color: var(--paper);
  background-image:
    linear-gradient(rgba(21, 17, 13, .032) 1px, transparent 1px),
    linear-gradient(90deg, rgba(21, 17, 13, .032) 1px, transparent 1px);
  background-size: 34px 34px;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.75;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}

[hidden] { display: none !important; }

.grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(120% 90% at 50% 0%, transparent 40%, rgba(21, 17, 13, .07) 100%);
}

.latin { font-family: var(--mono); font-size: .92em; letter-spacing: -.01em; }

code {
  font-family: var(--mono);
  font-size: .86em;
  background: rgba(180, 89, 31, .09);
  padding: .1em .4em;
  border-radius: 3px;
  direction: ltr;
  display: inline-block;
}

/* ── Shared type ────────────────────────────────────────────────────── */
.kicker {
  margin: 0 0 .5rem;
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: .5rem;
}
.kicker::before {
  content: "";
  width: 9px; height: 9px;
  background: var(--accent);
  display: inline-block;
  transform: rotate(45deg);
}

h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; }

/* ── Gate ───────────────────────────────────────────────────────────── */
.gate {
  position: relative;
  z-index: 1;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
}

.gate-card {
  position: relative;
  width: 100%;
  max-width: 440px;
  background: var(--paper-2);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  padding: 34px 26px 26px;
  animation: rise .55s cubic-bezier(.2, .7, .3, 1) both;
}
.gate-card::before,
.gate-card::after {
  content: "";
  position: absolute;
  width: 14px; height: 14px;
  border: 2px solid var(--accent);
  opacity: .75;
}
.gate-card::before { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
.gate-card::after { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }

.monogram {
  font-family: var(--mono);
  font-size: .8rem;
  letter-spacing: .12em;
  color: var(--accent);
  margin: 0 0 1.2rem;
}
.monogram span { opacity: .5; }

.gate h1 {
  font-size: clamp(1.9rem, 7vw, 2.4rem);
  line-height: 1.2;
  letter-spacing: -.01em;
  margin-bottom: .9rem;
}
.gate-sub {
  font-family: var(--sans);
  font-size: .8rem;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: .04em;
}

.gate-note {
  margin: 0 0 1.6rem;
  font-size: .9rem;
  color: var(--muted);
  line-height: 1.8;
}

label {
  display: block;
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .45rem;
}

.field {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--ink);
  background: var(--paper);
  margin-bottom: .8rem;
}
.field input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  padding: .85rem .9rem;
  font-family: var(--mono);
  font-size: 1rem;
  letter-spacing: .12em;
  color: var(--ink);
}
.field input:focus { outline: none; }
.field:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

.reveal {
  border: 0;
  border-inline-start: 1px solid var(--line);
  background: transparent;
  font-family: var(--sans);
  font-size: .78rem;
  color: var(--muted);
  padding: 0 .8rem;
  cursor: pointer;
}
.reveal[aria-pressed="true"] { color: var(--accent-deep); }

.submit {
  width: 100%;
  position: relative;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  font-family: var(--sans);
  font-size: .95rem;
  font-weight: 500;
  letter-spacing: .04em;
  padding: .9rem 1rem;
  cursor: pointer;
  transition: background-color .2s ease, transform .1s ease;
}
.submit:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.submit:active { transform: translateY(1px); }
.submit[aria-busy="true"] .submit-label { opacity: .55; }
.submit-spinner {
  display: none;
  width: 14px; height: 14px;
  border: 2px solid rgba(244, 239, 228, .35);
  border-top-color: var(--paper);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
.submit[aria-busy="true"] .submit-spinner {
  display: inline-block;
  position: absolute;
  inset-inline-end: 1rem;
  top: calc(50% - 7px);
}

.error {
  margin: .8rem 0 0;
  font-size: .85rem;
  color: #96271c;
  border-inline-start: 2px solid #96271c;
  padding-inline-start: .6rem;
  line-height: 1.6;
}

.fineprint {
  margin: 1.6rem 0 0;
  padding-top: .9rem;
  border-top: 1px dashed var(--line);
  font-size: .74rem;
  color: var(--muted);
  line-height: 1.7;
}

/* ── Report ─────────────────────────────────────────────────────────── */
.report {
  position: relative;
  z-index: 1;
  max-width: 780px;
  margin: 0 auto;
  padding: clamp(28px, 6vw, 56px) clamp(18px, 5vw, 40px) 72px;
  animation: rise .6s cubic-bezier(.2, .7, .3, 1) both;
}

.report section { margin: 0 0 2.6rem; }

.report h2 {
  font-size: clamp(1.35rem, 4.5vw, 1.7rem);
  margin-bottom: 1rem;
  padding-bottom: .5rem;
  border-bottom: 1px solid var(--line);
}

.report p { margin: 0 0 1rem; }

.masthead { margin-bottom: 2.2rem; }
.masthead h1 {
  font-size: clamp(2.1rem, 8vw, 3.1rem);
  line-height: 1.16;
  letter-spacing: -.015em;
  margin-bottom: 1rem;
}
.standfirst {
  font-size: clamp(.95rem, 3.4vw, 1.08rem);
  color: var(--muted);
  max-width: 46ch;
  line-height: 1.8;
}

.meta {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  margin: 1.6rem 0 0;
  background: var(--line);
  border: 1px solid var(--line);
}
.meta > div { background: var(--paper-2); padding: .7rem .8rem; }
.meta dt {
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .2rem;
}
.meta dd { margin: 0; font-size: .84rem; line-height: 1.5; }
.meta .ok { color: var(--accent-deep); font-weight: 600; }

.callout {
  background: var(--paper-2);
  border: 1px solid var(--line-strong);
  border-inline-start: 3px solid var(--accent);
  padding: 1.1rem 1.2rem 1.2rem;
  margin-bottom: 2.6rem;
}
.callout h2 {
  font-family: var(--sans);
  font-size: .95rem;
  font-weight: 600;
  border: 0;
  padding: 0;
  margin-bottom: .5rem;
  color: var(--accent-deep);
}
.callout p { font-size: .9rem; margin: 0; line-height: 1.8; }

/* ── Animated board ─────────────────────────────────────────────────── */
.panel {
  background: var(--paper-2);
  border: 1px solid var(--line-strong);
  padding: clamp(16px, 4vw, 26px);
  margin-bottom: 2.6rem;
  box-shadow: var(--shadow);
}
.panel-head h2 { border: 0; padding: 0; margin-bottom: .5rem; }
.panel-head .lede { font-size: .88rem; color: var(--muted); line-height: 1.8; margin-bottom: 1rem; }

.wiring, .mindmap {
  display: block;
  width: 100%;
  height: auto;
  margin: .2rem auto .4rem;
}
.mindmap { max-width: 460px; }
.wiring text { user-select: none; }
.wiring .axis { outline: none; }
.wiring .axis:focus-visible { outline: none; }
.wiring .axis:focus-visible .node { stroke-width: 3; }

.panel-caption {
  border-top: 1px dashed var(--line);
  padding-top: .8rem;
  min-height: 3.1em;
  font-size: .86rem;
  line-height: 1.7;
  color: var(--accent-deep);
}
.panel-caption strong { font-weight: 600; }

/* ── Table ──────────────────────────────────────────────────────────── */
table.results {
  width: 100%;
  border-collapse: collapse;
  font-size: .9rem;
  background: var(--paper-2);
  border: 1px solid var(--line);
}
table.results thead th {
  text-align: start;
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
  padding: .6rem .8rem;
  border-bottom: 1px solid var(--line-strong);
  background: rgba(21, 17, 13, .03);
}
table.results tbody th, table.results tbody td {
  padding: .7rem .8rem;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
  text-align: start;
  line-height: 1.65;
}
table.results tbody th { font-weight: 600; white-space: nowrap; }
table.results tbody tr:last-child th,
table.results tbody tr:last-child td { border-bottom: 0; }

/* ── Sample text ────────────────────────────────────────────────────── */
.sample {
  background: var(--paper-2);
  border: 1px solid var(--line);
  padding: 1.1rem 1.2rem 1.2rem;
  position: relative;
}
.sample p { font-size: .93rem; line-height: 1.95; }
.sample-title {
  font-family: var(--serif);
  font-size: 1.05rem !important;
  font-weight: 600;
  margin-bottom: .6rem !important;
  padding-bottom: .5rem;
  border-bottom: 1px solid var(--line);
}
.copy {
  border: 1px solid var(--ink);
  background: transparent;
  font-family: var(--sans);
  font-size: .76rem;
  padding: .35rem .8rem;
  cursor: pointer;
  margin-top: .3rem;
}
.copy:hover { background: var(--ink); color: var(--paper); }
.copy-state { font-size: .74rem; color: var(--muted); margin-inline-start: .5rem; }

/* ── Metrics ────────────────────────────────────────────────────────── */
.lede { font-size: .88rem; color: var(--muted); }

.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin: 1rem 0 1.2rem;
}
.metric {
  background: var(--paper-2);
  padding: .9rem .8rem;
  display: flex;
  flex-direction: column;
  gap: .15rem;
}
.metric .value {
  font-family: var(--mono);
  font-size: clamp(1.3rem, 6vw, 1.7rem);
  font-weight: 500;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.metric .label { font-size: .7rem; color: var(--muted); line-height: 1.5; }
.metric.accent { background: #f7e9dd; }
.metric.accent .value { color: var(--accent-deep); }

.insight {
  font-size: .9rem;
  line-height: 1.85;
  border-inline-start: 2px solid var(--accent);
  padding-inline-start: .9rem;
  color: var(--ink);
}

/* ── Capabilities ───────────────────────────────────────────────────── */
.caps { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
.caps li {
  position: relative;
  padding-inline-start: 1.4rem;
  font-size: .9rem;
  line-height: 1.8;
}
.caps li::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: .72em;
  width: 8px; height: 2px;
  background: var(--accent);
}

/* ── Colophon ───────────────────────────────────────────────────────── */
.colophon { margin-top: 2.4rem; padding-top: 1.2rem; border-top: 1px solid var(--line-strong); }
.colophon p { font-size: .85rem; color: var(--muted); }
.colophon pre {
  background: var(--ink);
  color: #f0e9dd;
  padding: .9rem 1rem;
  overflow-x: auto;
  direction: ltr;
  text-align: left;
  border-radius: 2px;
}
.colophon pre code {
  background: none;
  padding: 0;
  color: inherit;
  font-size: .8rem;
  line-height: 1.8;
}
.small { font-size: .74rem !important; }

/* ── Footer ─────────────────────────────────────────────────────────── */
.site-foot {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  max-width: 780px;
  margin: 0 auto;
  padding: 0 clamp(18px, 5vw, 40px) calc(28px + env(safe-area-inset-bottom));
  font-family: var(--mono);
  font-size: .68rem;
  color: var(--muted);
  letter-spacing: .06em;
}
.lock {
  border: 0;
  background: none;
  font-family: var(--sans);
  font-size: .74rem;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  padding: 0;
}
.lock:hover { color: var(--accent-deep); }

/* ── Motion ─────────────────────────────────────────────────────────── */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}
@keyframes shake {
  10%, 90% { transform: translateX(-1px); }
  20%, 80% { transform: translateX(2px); }
  30%, 50%, 70% { transform: translateX(-4px); }
  40%, 60% { transform: translateX(4px); }
}
.gate-card.shake { animation: shake .5s cubic-bezier(.36, .07, .19, .97); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

/* ── Mobile table ───────────────────────────────────────────────────── */
@media (max-width: 620px) {
  .meta { grid-template-columns: 1fr; }

  table.results { border: 0; background: none; }
  table.results thead { display: none; }
  table.results tbody tr {
    display: block;
    background: var(--paper-2);
    border: 1px solid var(--line);
    margin-bottom: .7rem;
    padding: .2rem 0;
  }
  table.results tbody th {
    display: block;
    padding: .6rem .8rem .3rem;
    white-space: normal;
    font-family: var(--serif);
    font-size: 1rem;
    border-bottom: 1px dashed var(--line);
  }
  table.results tbody td {
    display: block;
    border: 0;
    padding: .45rem .8rem;
    font-size: .84rem;
  }
  table.results tbody td::before {
    content: attr(data-label) " — ";
    color: var(--muted);
    font-family: var(--mono);
    font-size: .62rem;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
}

</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<main class="gate" id="gate">
  <div class="gate-card">
    <p class="monogram" aria-hidden="true">A<span>·</span>L</p>
    <p class="kicker">مختبر <span class="latin">OpenAI API</span></p>
    <h1>تقرير محمي<br><span class="gate-sub">بكلمة مرور واحدة</span></h1>
    <p class="gate-note">
      المحتوى مشفّر داخل هذه الصفحة نفسها. لا خادم ولا حساب؛ الكلمة هي المفتاح،
      وبعد فتحها تعمل الصفحة من أي جوال.
    </p>

    <form id="gate-form" autocomplete="off">
      <label for="password">كلمة المرور</label>
      <div class="field">
        <input id="password" name="password" type="password" inputmode="numeric"
               autocomplete="current-password" spellcheck="false" required
               placeholder="••••••••">
        <button type="button" class="reveal" id="reveal" aria-label="إظهار كلمة المرور" aria-pressed="false">
          <span aria-hidden="true">إظهار</span>
        </button>
      </div>
      <button type="submit" class="submit" id="submit">
        <span class="submit-label">افتح التقرير</span>
        <span class="submit-spinner" aria-hidden="true"></span>
      </button>
      <p class="error" id="error" role="alert" hidden></p>
    </form>

    <p class="fineprint">
      إن نسيت الكلمة، لا يمكن استرجاع المحتوى منها؛ اطلب رابطًا جديدًا بكلمة جديدة.
    </p>
  </div>
</main>

<main class="report" id="report" hidden></main>

<footer class="site-foot" id="site-foot" hidden>
  <span>اختبار حي · <span class="latin">Manus Sandbox</span></span>

<script>
/* مختبر OpenAI API — فتح مشفّر داخل المتصفح، بلا خادم */
(() => {
  "use strict";

  const PAYLOAD_URL = "assets/payload.json";
  const SESSION_KEY = "apilab.pw";

  const gate = document.getElementById("gate");
  const report = document.getElementById("report");
  const foot = document.getElementById("site-foot");
  const form = document.getElementById("gate-form");
  const input = document.getElementById("password");
  const submit = document.getElementById("submit");
  const errorBox = document.getElementById("error");
  const reveal = document.getElementById("reveal");
  const lock = document.getElementById("lock");
  const card = document.querySelector(".gate-card");

  const AXIS_NOTES = [
    "<strong>1 · اكتشاف النماذج:</strong> عشرة نماذج متاحة في البوابة، وكلها تعلن دعم الأدوات والرؤية والإخراج المنظم — فحص القدرات من الواجهة نفسها، لا من الذاكرة.",
    "<strong>2 · توليد النص:</strong> فقرة عربية كاملة في 6.28 ثانية بـ 876 توكنًا. هذا المحور يغذّي ما بعده: كل إخراج يُستهلك في محور آخر.",
    "<strong>3 · الإخراج المنظم:</strong> مخطط JSON صارم أعاد موعدين بحقول ثابتة بلا حقل زائد — هنا ينتهي عصر تحليل النص بـ regex.",
    "<strong>4 · الأدوات:</strong> النموذج طلب <span class=\"latin\">get_weather</span>، نُفّذت الدالة، ثم دُمجت النتيجة في إجابة نهائية. التشابك مع المحور 2 واضح: الأداة تعيد نصًا يُقرأ.",
    "<strong>5 · الاستدلال:</strong> حلّ المعادلتين بدقة: 23 دجاجة و12 أرنبًا. الجهد المنخفض كفى هنا، وارتفاعه يرفع التكلفة لا الدقة فقط.",
    "<strong>6 · الرؤية:</strong> قرأ عنوان الرسم والقيم الأربع. هذا المحور يتقاطع مع الاستدلال: الصورة تصبح مدخلًا، والاستنتاج يبني عليه."
  ];

  let plaintext = null;

  const b64 = (s) => {
    const bin = atob(s);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
    return out;
  };

  async function decrypt(password, payload) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(payload.salt), iterations: payload.iter, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const buf = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64(payload.iv) }, key, b64(payload.ct)
    );
    return new TextDecoder().decode(buf);
  }

  function wireReport() {
    const copyBtn = report.querySelector(".copy");
    const state = report.querySelector(".copy-state");
    copyBtn?.addEventListener("click", async () => {
      const paragraph = report.querySelector(".sample p:not(.sample-title)");
      if (!paragraph) return;
      try {
        await navigator.clipboard.writeText(paragraph.textContent.trim());
        state.textContent = "نُسخ.";
      } catch {
        state.textContent = "انسخه يدويًا.";
      }
      setTimeout(() => { state.textContent = ""; }, 2600);
    });

    const caption = report.querySelector("#axis-caption");
    const axes = [...report.querySelectorAll(".axis")];

    const activate = (axis) => {
      axes.forEach((a) => a.classList.toggle("is-active", a === axis));
      const note = AXIS_NOTES[Number(axis.dataset.axis) - 1];
      if (caption && note) caption.innerHTML = note;
    };

    axes.forEach((axis) => {
      axis.addEventListener("click", () => activate(axis));
      axis.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          activate(axis);
        }
      });
    });
  }

  function openReport(html) {
    plaintext = html;
    report.innerHTML = html;
    wireReport();
    gate.hidden = true;
    report.hidden = false;
    foot.hidden = false;
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  function fail(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
    input.setAttribute("aria-invalid", "true");
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
    input.select();
  }

  function setBusy(busy) {
    submit.setAttribute("aria-busy", String(busy));
    submit.disabled = busy;
  }

  let payloadPromise = null;
  const loadPayload = () => {
    payloadPromise ??= (window.__PAYLOAD__ ? Promise.resolve(window.__PAYLOAD__) : fetch(PAYLOAD_URL, { cache: "no-store" }).then((r) => {
      if (!r.ok) throw new Error("payload");
      return r.json();
    }));
    return payloadPromise;
  };

  async function attempt(password, { silent = false } = {}) {
    if (!password) return false;
    if (!window.crypto?.subtle) {
      fail("يتطلب المتصفح اتصالًا آمنًا (https) لفتح المحتوى.");
      return false;
    }
    setBusy(true);
    errorBox.hidden = true;
    try {
      const payload = await loadPayload();
      const html = await decrypt(password, payload);
      sessionStorage.setItem(SESSION_KEY, password);
      openReport(html);
      return true;
    } catch (error) {
      sessionStorage.removeItem(SESSION_KEY);
      if (!silent) fail("كلمة المرور غير صحيحة. جرّب مرة أخرى.");
      return false;
    } finally {
      setBusy(false);
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    attempt(input.value.trim());
  });

  reveal.addEventListener("click", () => {
    const shown = input.type === "text";
    input.type = shown ? "password" : "text";
    reveal.setAttribute("aria-pressed", String(!shown));
    reveal.querySelector("span").textContent = shown ? "إظهار" : "إخفاء";
    input.focus();
  });

  lock?.addEventListener("click", () => {
    sessionStorage.removeItem(SESSION_KEY);
    window.location.reload();
  });

  const saved = sessionStorage.getItem(SESSION_KEY);
  if (saved) {
    attempt(saved, { silent: true }).then((ok) => {
      if (!ok) input?.focus();
    });
  } else {
    input?.focus({ preventScroll: true });
  }

  // إتاحة إعادة الفتح السريع دون إعادة كتابة الكلمة في نفس الجلسة
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !plaintext && sessionStorage.getItem(SESSION_KEY)) {
      attempt(sessionStorage.getItem(SESSION_KEY), { silent: true });
    }
  });
})();

</script>
</body>
</html>
